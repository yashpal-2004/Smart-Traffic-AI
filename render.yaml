services:
  - type: web
    name: smart-traffic-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r backend/requirements-sumo.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
