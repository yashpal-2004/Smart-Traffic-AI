<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Smart Traffic AI architecture</title>
  <desc id="desc">A static browser client calls a FastAPI service. The service routes requests to a deterministic simulator, three signal controllers, a matched-seed evaluation runner, and local Q-table checkpoints. Reports return to the browser for display and download as JSON or CSV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c141d"/><stop offset="1" stop-color="#172431"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42c6a7"/><stop offset="1" stop-color="#79e2c4"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#67d7b8"/></marker>
    <style>
      .title{font:700 27px system-ui,sans-serif;fill:#eef5f7}.sub{font:13px system-ui,sans-serif;fill:#9caeb9}.label{font:700 13px system-ui,sans-serif;fill:#e9f1f4}.body{font:12px system-ui,sans-serif;fill:#a9b8c1}.small{font:10px ui-monospace,monospace;fill:#77908f}.box{fill:#14212b;stroke:#324753;stroke-width:1.2}.client{fill:#122a2b;stroke:#3e8e7b}.core{fill:#14232c;stroke:#3d6970}.persist{fill:#22232a;stroke:#77734e}.arrow{fill:none;stroke:#67d7b8;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}.tag{fill:#1e3b39;stroke:#376c5d}.tagText{font:10px ui-monospace,monospace;fill:#7de0c1}
    </style>
  </defs>
  <rect width="1280" height="720" rx="18" fill="url(#bg)"/>
  <text x="52" y="58" class="title">Smart Traffic AI · system architecture</text>
  <text x="52" y="84" class="sub">Local-first learning lab · deterministic simulator · matched-seed evaluation</text>

  <rect x="48" y="142" width="286" height="494" rx="14" class="box client"/>
  <text x="72" y="178" class="small">BROWSER · :4173</text>
  <text x="72" y="207" class="label">Signal Lab UI</text>
  <text x="72" y="235" class="body">Simulate</text><text x="72" y="258" class="body">Compare</text><text x="72" y="281" class="body">Learn</text>
  <line x1="72" y1="304" x2="308" y2="304" stroke="#2a464b"/>
  <text x="72" y="332" class="label">Evaluation views</text>
  <text x="72" y="358" class="body">Controller aggregates</text><text x="72" y="381" class="body">Paired deltas + intervals</text><text x="72" y="404" class="body">Scenario-level summaries</text>
  <line x1="72" y1="428" x2="308" y2="428" stroke="#2a464b"/>
  <text x="72" y="456" class="label">Client-side report files</text>
  <rect x="72" y="476" width="95" height="29" rx="7" class="tag"/><text x="96" y="495" class="tagText">JSON</text>
  <rect x="178" y="476" width="95" height="29" rx="7" class="tag"/><text x="205" y="495" class="tagText">CSV</text>
  <text x="72" y="545" class="small">No account · no remote storage</text>

  <rect x="392" y="142" width="316" height="494" rx="14" class="box"/>
  <text x="416" y="178" class="small">FASTAPI · :8000/api</text>
  <text x="416" y="207" class="label">Validated API</text>
  <rect x="416" y="226" width="268" height="72" rx="9" class="box core"/><text x="434" y="253" class="label">Run manager</text><text x="434" y="276" class="body">Step / pause / resume / reset</text>
  <rect x="416" y="316" width="268" height="75" rx="9" class="box core"/><text x="434" y="344" class="label">Training worker</text><text x="434" y="368" class="body">Train both tabular policies</text>
  <rect x="416" y="409" width="268" height="91" rx="9" class="box core"/><text x="434" y="438" class="label">Evaluation route</text><text x="434" y="462" class="body">Matched scenarios + seeds</text><text x="434" y="483" class="body">Report metadata + fingerprints</text>
  <text x="416" y="548" class="small">Runs and training progress live in memory</text>

  <rect x="770" y="142" width="260" height="494" rx="14" class="box core"/>
  <text x="794" y="178" class="small">DOMAIN · PYTHON</text>
  <text x="794" y="207" class="label">Traffic simulator</text>
  <text x="794" y="234" class="body">Seeded arrivals</text><text x="794" y="257" class="body">Four queues · two phases</text><text x="794" y="280" class="body">Amber transition · metrics</text>
  <line x1="794" y1="304" x2="1006" y2="304" stroke="#31464b"/>
  <text x="794" y="333" class="label">Controllers</text>
  <text x="794" y="360" class="body">Fixed-time baseline</text><text x="794" y="383" class="body">Hold/switch Q-learning</text><text x="794" y="406" class="body">Green-duration Q-learning</text>
  <line x1="794" y1="430" x2="1006" y2="430" stroke="#31464b"/>
  <text x="794" y="459" class="label">Evaluation runner</text><text x="794" y="486" class="body">Episode results + paired report</text>
  <text x="794" y="548" class="small">One lane per approach · toy model</text>

  <rect x="1092" y="142" width="144" height="222" rx="14" class="box persist"/>
  <text x="1112" y="178" class="small">LOCAL FILES</text><text x="1112" y="207" class="label">Q tables</text>
  <text x="1112" y="238" class="body">hold/switch</text><text x="1112" y="261" class="body">duration</text>
  <text x="1112" y="304" class="small">ignored by Git</text>
  <rect x="1092" y="394" width="144" height="242" rx="14" class="box persist"/>
  <text x="1112" y="430" class="small">REPORT IDENTITY</text><text x="1112" y="459" class="label">SHA-256</text><text x="1112" y="486" class="body">checkpoint</text><text x="1112" y="509" class="body">fingerprints</text><text x="1112" y="553" class="body">source revision</text><text x="1112" y="576" class="body">signal config</text>

  <path d="M334 250H382" class="arrow"/><text x="342" y="234" class="small">JSON</text>
  <path d="M708 457H760" class="arrow"/><text x="713" y="439" class="small">simulate</text>
  <path d="M1030 247H1080" class="arrow"/><path d="M1080 285H1030" class="arrow dashed"/>
  <path d="M1030 513H1080" class="arrow"/>
  <path d="M760 526H718" class="arrow"/><path d="M392 526H342" class="arrow"/><text x="348" y="510" class="small">report</text>
  <text x="52" y="682" class="small">Educational use only · not a real-world traffic-control system</text>
</svg>
